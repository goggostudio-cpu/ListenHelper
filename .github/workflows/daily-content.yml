name: Daily content generator

on:
  schedule:
    # 15:05 UTC = 00:05 KST (다음 날). 매일 오늘 날짜 + 7일 버퍼를 보장합니다.
    - cron: "5 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          START_DATE="$(TZ='Asia/Seoul' date +%F)"
          echo "Generating from ${START_DATE} (KST today)"
          python scripts/generate_week.py --start "${START_DATE}" --days 8

      - name: Commit and push
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain content/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add content/
            git commit -m "chore(daily-content): add today's English content ($(TZ='Asia/Seoul' date +%F))"
            git push
            echo "Committed and pushed today's content."
          else
            echo "No new content; nothing to commit."
          fi